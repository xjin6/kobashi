<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="icon" type="image/svg+xml" href="/kobashi.svg?v=4"/>
<link rel="manifest" href="/manifest.json"/>
<title>Kobashi</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0a0c10;--fg:#e6edf3;--muted:#8b949e;--card-bg:rgba(22,27,34,.85);--card-border:rgba(48,54,61,.6);--card-shadow:0 24px 48px rgba(0,0,0,.4),0 0 0 1px rgba(48,54,61,.3);--bg-glow:radial-gradient(ellipse at 20% 50%,rgba(88,166,255,.15),transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(63,185,80,.12),transparent 50%),radial-gradient(ellipse at 50% 80%,rgba(136,103,255,.12),transparent 50%);--accent1:#58a6ff;--accent2:#a371f7;--btn-bg:rgba(33,38,45,.8);--btn-border:rgba(48,54,61,.8);--btn-hover-bg:rgba(48,54,61,.8);--btn-hover-border:rgba(88,166,255,.3);--btn-hover-glow:0 0 20px rgba(88,166,255,.1);--code-bg:rgba(13,17,23,.8);--code-border:rgba(48,54,61,.6);--panel-bg:rgba(33,38,45,.85);--panel-border:rgba(48,54,61,.5);--toggle-bg:#21262d;--toggle-border:#30363d;--badge-bg:rgba(88,166,255,.1);--badge-border:rgba(88,166,255,.2);--badge-color:#58a6ff;--disconnect-color:#f85149;--disconnect-border:rgba(248,81,73,.3);--env-bg:rgba(33,38,45,.85);--env-border:rgba(48,54,61,.5);--env-key:#ff7b72;--env-val:#a5d6ff;--dot-gray:#484f58;--spinner-bg:rgba(48,54,61,.8);--logo-color:#58a6ff;--toggle-on-bg:#1f6feb;--toggle-on-border:#1f6feb;--toggle-on-shadow:rgba(31,111,235,.25);--dot-active:#58a6ff;--dot-active-glow:rgba(88,166,255,.35);--copied-color:#58a6ff;--tile-bg:rgba(60,66,74,.55);--tile-border:rgba(82,88,96,.5)}
  [data-theme="light"]{--bg:#f0f4f0;--fg:#1a2e1a;--muted:#5a6e5a;--card-bg:rgba(255,255,255,.9);--card-border:rgba(46,139,87,.15);--card-shadow:0 24px 48px rgba(0,0,0,.08),0 0 0 1px rgba(46,139,87,.1);--bg-glow:radial-gradient(ellipse at 20% 50%,rgba(34,197,94,.1),transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(16,185,129,.08),transparent 50%),radial-gradient(ellipse at 50% 80%,rgba(74,222,128,.06),transparent 50%);--accent1:#15803d;--accent2:#0891b2;--btn-bg:rgba(255,255,255,.9);--btn-border:rgba(46,139,87,.25);--btn-hover-bg:rgba(240,253,244,.9);--btn-hover-border:rgba(34,197,94,.5);--btn-hover-glow:0 0 20px rgba(34,197,94,.1);--code-bg:rgba(240,253,244,.8);--code-border:rgba(46,139,87,.15);--panel-bg:rgba(240,253,244,.6);--panel-border:rgba(46,139,87,.12);--toggle-bg:#d1d5db;--toggle-border:#9ca3af;--badge-bg:rgba(34,197,94,.1);--badge-border:rgba(34,197,94,.25);--badge-color:#16a34a;--disconnect-color:#dc2626;--disconnect-border:rgba(220,38,38,.3);--env-bg:rgba(240,253,244,.8);--env-border:rgba(46,139,87,.12);--env-key:#b91c1c;--env-val:#1e40af;--dot-gray:#9ca3af;--spinner-bg:rgba(46,139,87,.2);--logo-color:#16a34a;--toggle-on-bg:#238636;--toggle-on-border:#238636;--toggle-on-shadow:rgba(35,134,54,.3);--dot-active:#3fb950;--dot-active-glow:rgba(63,185,80,.4);--copied-color:#3fb950;--tile-bg:rgba(255,255,255,.9);--tile-border:rgba(46,139,87,.15)}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column;overflow:hidden;transition:background .3s,color .3s}
  .bg{position:fixed;inset:0;z-index:0;background:var(--bg-glow)}
  .card{position:relative;z-index:1;background:var(--card-bg);backdrop-filter:blur(20px);border:none;border-radius:0;padding:24px 32px 0;width:100%;flex:1;display:flex;flex-direction:column;overflow-y:auto;scrollbar-gutter:stable;transition:background .3s,color .3s}
  .logo{display:flex;align-items:center;gap:6px;margin-bottom:18px;margin-left:-4px}
  .logo svg{width:28px;height:28px;color:var(--logo-color)}
  h1{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--accent1),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  /* 两行文案是硬约束（<br> 手动断行）。第一行在 400px 窗口下实测 315.6px，
     可用宽度 321px —— 余量只有 5.4px。Windows 的 Segoe UI 比 macOS 的 SF 略宽，
     一旦超出就会折成第三行，把下方所有间距顶乱。text-wrap:balance 在这里不合适
     （它会重新分配断点，破坏我们指定的断行），所以用 nowrap 锁死每行：宁可极端
     情况下被裁切一两个像素，也不能让布局塌掉。 */
  /* margin-bottom 由 28 收到 20，正好抵消 account box 向上多长的 8px，
     使 box 底边、以及其下方所有元素的位置保持不变。 */
  .sub{color:var(--muted);font-size:14px;margin-bottom:20px;white-space:nowrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:10px;border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--fg);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;backdrop-filter:blur(4px)}
  .btn:hover{background:var(--btn-hover-bg);border-color:var(--btn-hover-border);box-shadow:var(--btn-hover-glow)}
  .btn:active{transform:scale(.97)}
  .code-box{background:var(--code-bg);border:1px solid var(--code-border);border-radius:12px;padding:20px;text-align:center;margin:14px 0;transition:all .3s}
  .user-code{font-family:"SF Mono",Consolas,monospace;font-size:32px;font-weight:800;letter-spacing:.18em;background:linear-gradient(135deg,var(--accent1),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .link{color:var(--accent1);text-decoration:none;font-size:13px;transition:color .2s}
  .link:hover{color:var(--accent2);text-decoration:underline}
  .btn-copy{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:6px;border:1px solid var(--code-border);background:var(--btn-bg);color:var(--muted);font-size:11px;cursor:pointer;transition:all .2s;margin-top:10px}
  .btn-copy:hover{background:var(--btn-hover-bg);color:var(--fg);border-color:var(--btn-hover-border)}
  .btn-copy.copied{border-color:var(--copied-color);color:var(--copied-color)}
  .spinner{width:14px;height:14px;border:2px solid var(--spinner-bg);border-top-color:var(--accent1);border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:12px}
  .panel{background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:12px;padding:18px;margin-top:16px;transition:all .3s}
  .panel-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .panel-row:last-child{margin-bottom:0}
  .panel-label{font-size:12px;color:var(--muted)}
  .panel-value{font-size:13px;color:var(--fg);font-weight:500}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
  .dot-green{background:var(--dot-active);box-shadow:0 0 8px var(--dot-active-glow)}
  .dot-gray{background:var(--dot-gray)}
  .dot-pulse{animation:pulse 2s ease-in-out infinite}
  .toggle{position:relative;width:44px;height:24px;border-radius:12px;background:var(--toggle-bg);border:1px solid var(--toggle-border);cursor:pointer;transition:all .3s}
  .toggle.on{background:var(--toggle-on-bg);border-color:var(--toggle-on-border);box-shadow:0 0 12px var(--toggle-on-shadow)}
  .toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:all .3s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .toggle.on .knob{left:22px}
  .user-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;background:var(--badge-bg);border:1px solid var(--badge-border);border-radius:20px;font-size:13px;color:var(--badge-color)}
  .btn-disconnect{background:transparent;border:1px solid var(--disconnect-border);color:var(--disconnect-color);font-size:12px;padding:6px 14px;border-radius:8px}
  .btn-disconnect:hover{background:rgba(248,81,73,.1);border-color:var(--disconnect-color)}
  .section-title{font-size:11px;color:var(--muted);margin-top:20px;margin-bottom:8px}
  .fade-in{animation:fadeIn .4s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .alt-row{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}
  .linkbtn{color:var(--accent1);text-decoration:none;font-size:12px;background:none;border:none;padding:0;cursor:pointer;font-family:inherit;transition:color .2s}
  .linkbtn:hover{color:var(--accent2);text-decoration:underline}
  .input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--code-border);background:var(--code-bg);color:var(--fg);font-size:13px;font-family:"SF Mono",Consolas,monospace;transition:all .2s;outline:none}
  .input::placeholder{color:var(--muted);opacity:.6}
  .input:focus{border-color:var(--btn-hover-border);box-shadow:var(--btn-hover-glow)}
  .input.bad{border-color:var(--disconnect-border)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .btn:disabled:hover{background:var(--btn-bg);border-color:var(--btn-border);box-shadow:none}
  .err{display:none;gap:7px;align-items:flex-start;font-size:12px;color:var(--disconnect-color);background:rgba(248,81,73,.08);border:1px solid var(--disconnect-border);border-radius:9px;padding:9px 11px;margin-top:10px;line-height:1.5;text-align:left}
  .err.show{display:flex}
  [data-theme="light"] .err{background:rgba(220,38,38,.06)}
  .err svg{flex-shrink:0;margin-top:1px}
  #view-idle,#view-waiting,#view-connected{display:none}
  /* The token field lives inside the idle view rather than on a screen of its
     own: it is one input and one button, and a whole extra view for that made
     the friend-facing path feel longer than the flow it replaces. Hidden until
     the link is clicked so the default screen stays exactly as it was. */
  #token-area{display:none;width:100%;max-width:280px;margin-top:14px;flex-direction:column}
  #token-area.open{display:flex}
  #token-area .btn{margin-top:10px;width:100%;justify-content:center}
  #view-idle{position:absolute;inset:0;z-index:1;flex-direction:column;justify-content:center;align-items:center;padding:0 32px}
  #view-waiting{position:absolute;inset:0;z-index:1;flex-direction:column;justify-content:center;padding:0 32px}
  #view-connected{flex:1}
  .logo,.sub{position:relative;z-index:2}
  .footer{position:relative;z-index:2}
  .footer{padding:16px 0 14px;font-size:10px;color:var(--muted);opacity:.65;text-align:right;line-height:1.6}
  .footer a{color:inherit;text-decoration:none;cursor:pointer}
  .footer a:hover{opacity:.8;text-decoration:underline}
  .theme-btn{position:absolute;top:24px;right:32px;width:32px;height:32px;border-radius:8px;border:1px solid var(--card-border);background:var(--btn-bg);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:3}
  .theme-btn:hover{color:var(--fg);border-color:var(--btn-hover-border)}
  .bridge-logo{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--tile-bg);border:1px solid var(--tile-border);overflow:hidden}
  .bridge-logo svg{width:20px;height:20px}
  .bridge-logo img{width:24px;height:24px;object-fit:contain}
  .bridge-logo.claude{color:#d97757}
  .panel-row-left{display:flex;align-items:center;gap:12px}
  /* ── Account 面板：去掉 "Account" 标签，腾出的行高给用量进度条 ──────────────
     高度锁死。旧布局 = 18(pad)+14(label)+4+26(badge)+18(pad) = 80px。
     现在 box 向【上】长到 88px（文案下方间距同步 28→20 补偿），底边因此仍钉在
     原位置，从这里往下的一切（两个 bridge 面板、底部动画、footer）完全不变。
     多出的 8px 全部给内部呼吸：
        14(pad-top)+26(badge)+14(gap)+12(标签行)+6(文字↔条)+5(条)+11(pad-bottom) = 88 */
  .panel.acct{padding:14px 18px 11px;min-height:88px}
  .usage{margin-top:14px}
  .usage-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
  .usage-label{font-size:11px;color:var(--muted);line-height:12px}
  .usage-num{font-size:11px;color:var(--muted);line-height:12px;font-variant-numeric:tabular-nums}
  .usage-num b{color:var(--fg);font-weight:600}
  .track{position:relative;height:5px;border-radius:3px;background:var(--toggle-bg);overflow:hidden}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--accent1),var(--accent2));transition:width .6s cubic-bezier(.4,0,.2,1)}
  /* 额度是千万级，正常用量下占比不到 1%：给一个最小可见宽度，否则圆角会把
     填充完全吃掉，看起来像根本没渲染。 */
  .fill.tiny{min-width:3px}
  /* 拿不到用量时整段隐藏，绝不显示 "0 / 0" 这种半残状态 */
  .usage.hidden{display:none}
  /* ── Ambient footer animation ("Dither Crossing") ────────────────────────
     A Bayer ordered-dither field whose dissolve edge sweeps left→right: sparse
     muted grain on the local-client side resolving into dense accent pixels on
     the Copilot side. margin-top:auto pushes it to the bottom of the card, and
     the top padding is the breathing room between it and the Codex panel. */
  .dx{position:relative;width:100%;height:82px;margin-top:auto;padding-top:18px;overflow:hidden;pointer-events:none;flex-shrink:0}
  .dx canvas{display:block;width:100%;height:100%;opacity:.9;transition:opacity .6s ease}
  /* Both bridges paused → the field dims and freezes (the JS also stops the loop). */
  .dx[data-state="paused"] canvas{opacity:.32}
  /* Feather every edge into the card so the block never reads as a panel. */
  .dx::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,var(--card-bg) 0%,transparent 26%,transparent 74%,var(--card-bg) 100%),linear-gradient(to right,var(--card-bg) 0%,transparent 10%,transparent 94%,var(--card-bg) 100%)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle light/dark mode"><svg id="theme-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"></svg></button>
  <div class="logo">
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <defs>
        <linearGradient id="kobashiGrad" gradientUnits="userSpaceOnUse" x1="144" y1="96" x2="368" y2="416">
          <stop offset="0%" stop-color="var(--accent1)"/>
          <stop offset="100%" stop-color="var(--accent2)"/>
        </linearGradient>
      </defs>
      <g stroke="url(#kobashiGrad)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M144 256 L368 96"/>
        <path d="M144 256 L368 416"/>
      </g>
    </svg>
    <h1>Kobashi</h1>
  </div>
  <p class="sub">Route Anthropic Claude Code and OpenAI Codex<br>through GitHub Copilot subscription</p>

  <div id="view-idle">
    <button class="btn" onclick="startAuth()">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      Connect with GitHub
    </button>
    <div class="alt-row" id="token-teaser">Have an access token? <button class="linkbtn" onclick="revealToken()">Paste it instead</button></div>
    <div id="token-area">
      <input class="input" id="token-input" type="password" placeholder="Paste your access token" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" oninput="onTokenType()" onkeydown="if(event.key==='Enter')submitToken()"/>
      <button class="btn" id="token-submit" onclick="submitToken()" disabled>Connect</button>
      <div class="err" id="token-err">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM0 8a8 8 0 1116 0A8 8 0 010 8zm9 3a1 1 0 11-2 0 1 1 0 012 0zm-.25-6.25a.75.75 0 00-1.5 0v3.5a.75.75 0 001.5 0z"/></svg>
        <span id="token-errmsg"></span>
      </div>
    </div>
  </div>

  <div id="view-waiting" class="fade-in">
    <div class="code-box">
      <div style="font-size:12px;color:#8b949e;margin-bottom:10px">Enter this code at GitHub</div>
      <div style="margin-bottom:12px"><a class="link" id="verify-link" href="#" onclick="openLink(event)"></a></div>
      <div class="user-code" id="user-code"></div>
      <button class="btn-copy" id="btn-copy" onclick="copyCode()"><svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 010 1.5h-1.5a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-1.5a.75.75 0 011.5 0v1.5A1.75 1.75 0 019.25 16h-7.5A1.75 1.75 0 010 14.25z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0114.25 11h-7.5A1.75 1.75 0 015 9.25zm1.75-.25a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-7.5a.25.25 0 00-.25-.25z"/></svg> Copy</button>
    </div>
    <div class="status"><span class="spinner"></span> Waiting for authorization...</div>
  </div>

  <div id="view-connected" class="fade-in">
    <div class="panel acct">
      <div class="panel-row" style="margin-bottom:0">
        <span class="user-badge"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg> <span id="username"></span></span>
        <button class="btn btn-disconnect" onclick="disconnect()">Disconnect</button>
      </div>
      <div class="usage hidden" id="usage">
        <div class="usage-row">
          <span class="usage-label">AI credits this cycle</span>
          <span class="usage-num"><b id="usage-used">—</b> / <span id="usage-ent"></span></span>
        </div>
        <div class="track"><div class="fill" id="usage-fill" style="width:0"></div></div>
      </div>
    </div>

    <div class="panel" style="margin-top:12px">
      <div class="panel-row">
        <div class="panel-row-left">
          <div class="bridge-logo claude" title="Anthropic Claude">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 0 1-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76.562-.34 1.095-1.064 1.349-.881 1.141-1.264 1.7-.79 1.36.073.11.188-.02 2.856-.606 1.543-.28 1.841-.315.833.388.091.395-.328.807-1.969.486-2.309.462-3.439.813-.042.03.049.061 1.549.146.662.036h1.622l3.02.225.79.522.474.638-.079.485-1.215.62-1.64-.389-3.829-.91-1.312-.329h-.182v.11l1.093 1.068 2.006 1.81 2.509 2.33.127.578-.322.455-.34-.049-2.205-1.657-.851-.747-1.926-1.62h-.128v.17l.444.649 2.345 3.521.122 1.08-.17.353-.608.213-.668-.122-1.374-1.925-1.415-2.167-1.143-1.943-.14.08-.674 7.254-.316.37-.729.28-.607-.461-.322-.747.322-1.476.389-1.924.315-1.53.286-1.9.17-.632-.012-.042-.14.018-1.434 1.967-2.18 2.945-1.726 1.845-.414.164-.717-.37.067-.662.401-.589 2.388-3.036 1.44-1.882.93-1.086-.006-.158h-.055L4.132 18.56l-1.13.146-.487-.456.061-.746.231-.243 1.908-1.312-.006.006z"/></svg>

<script>
const sunSVG='<path d="M8 1a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 018 1zm0 10a3 3 0 100-6 3 3 0 000 6zm0-1.5a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm5.657-5.157a.75.75 0 010 1.06l-1.06 1.061a.75.75 0 11-1.061-1.06l1.06-1.061a.75.75 0 011.061 0zM15 8a.75.75 0 01-.75.75h-1.5a.75.75 0 010-1.5h1.5A.75.75 0 0115 8zm-2.343 5.657a.75.75 0 01-1.06 0l-1.061-1.06a.75.75 0 111.06-1.061l1.061 1.06a.75.75 0 010 1.061zM8 15a.75.75 0 01-.75-.75v-1.5a.75.75 0 011.5 0v1.5A.75.75 0 018 15zm-5.657-2.343a.75.75 0 010-1.06l1.06-1.061a.75.75 0 111.061 1.06l-1.06 1.061a.75.75 0 01-1.061 0zM1 8a.75.75 0 01.75-.75h1.5a.75.75 0 010 1.5h-1.5A.75.75 0 011 8zm2.343-5.657a.75.75 0 011.06 0l1.061 1.06a.75.75 0 01-1.06 1.061L3.343 3.403a.75.75 0 010-1.06z"/>';
const moonSVG='<path d="M9.598 1.591a.75.75 0 01.785-.175 7 7 0 11-8.967 8.967.75.75 0 01.961-.96 5.5 5.5 0 007.046-7.046.75.75 0 01.175-.786z"/>';
const sysLight=window.matchMedia('(prefers-color-scheme:light)');
// Painting the theme and REMEMBERING it are two different things, and merging
// them was the bug: the old applyTheme() wrote to localStorage on every call,
// including the one during start-up that had just derived the theme from the
// system. One launch was therefore enough to pin the theme forever, so macOS's
// light/dark switch stopped reaching a window that had never been told to
// override anything. Now only an explicit click persists a choice.
function lsGet(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(_){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(_){} }

// Upgrade path. Every existing install already has a 'theme' value that the old
// code wrote automatically at start-up, so reading it as a deliberate choice
// would keep those users pinned exactly as before and this fix would appear to
// do nothing. A manual choice is now recorded with its own 'themeManual' flag,
// which the old build never wrote — so a 'theme' with no flag beside it is
// provably auto-written, and gets cleared once.
(function(){
  if(lsGet('theme')!==null && lsGet('themeManual')===null) lsDel('theme');
})();

function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('theme-icon').innerHTML=t==='light'?sunSVG:moonSVG;
  // The animation caches its palette, so it must re-bake on a theme change —
  // otherwise it would keep painting dark-theme blue over the light theme.
  if(window.kobashiRepaintAnim)window.kobashiRepaintAnim();
}
function systemTheme(){return sysLight.matches?'light':'dark'}
// A stored value means "the user overrode the system"; absent means "follow it".
function currentTheme(){
  const saved=lsGet('theme');
  return saved==='light'||saved==='dark'?saved:systemTheme();
}
function toggleTheme(){
  const next=currentTheme()==='light'?'dark':'light';
  // Toggling back to what the system already shows is read as "stop overriding",
  // so the button is also the way out of a manual choice — without this the
  // first click would silently opt you out of system-following for good.
  if(next===systemTheme()){ lsDel('theme'); lsDel('themeManual'); }
  else { lsSet('theme',next); lsSet('themeManual','1'); }
  applyTheme(next);
}
// Fires when macOS flips appearance (incl. the automatic sunset switch). Only
// repaints while the user has no explicit override standing.
sysLight.addEventListener('change',()=>{
  const saved=lsGet('theme');
  if(saved!=='light'&&saved!=='dark') applyTheme(systemTheme());
});
applyTheme(currentTheme());
let pollTimer=null,pollInterval=5000;
function show(v){['idle','waiting','connected'].forEach(x=>document.getElementById('view-'+x).style.display='none');document.getElementById('view-'+v).style.display=v==='connected'?'block':'flex'}
function setToggle(prefix,on){
  const t=document.getElementById(prefix+'-toggle'),d=document.getElementById(prefix+'-dot'),s=document.getElementById(prefix+'-text');
  if(on){t.classList.add('on');d.className='dot dot-green dot-pulse';s.textContent='Active'}
  else{t.classList.remove('on');d.className='dot dot-gray';s.textContent='Paused'}
  syncAnim();
}
// The footer animation represents traffic crossing the bridge, so it only goes
// dim-and-frozen when there is no bridge left carrying any — i.e. BOTH are off.
function syncAnim(){
  if(!window.kobashiAnimState)return;
  const on=document.getElementById('codex-toggle').classList.contains('on')
        || document.getElementById('claude-toggle').classList.contains('on');
  window.kobashiAnimState(on);
}
function openLink(e){
  e.preventDefault();
  const url=document.getElementById('verify-link').href;
  if(/^https?:\/\//i.test(url)){fetch('/api/open-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});}
}
function copyCode(){
  const code=document.getElementById('user-code').textContent;
  navigator.clipboard.writeText(code).then(()=>{
    const b=document.getElementById('btn-copy');b.classList.add('copied');b.innerHTML='<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"/></svg> Copied!';
    setTimeout(()=>{b.classList.remove('copied');b.innerHTML='<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 010 1.5h-1.5a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-1.5a.75.75 0 011.5 0v1.5A1.75 1.75 0 019.25 16h-7.5A1.75 1.75 0 010 14.25z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0114.25 11h-7.5A1.75 1.75 0 015 9.25zm1.75-.25a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-7.5a.25.25 0 00-.25-.25z"/></svg> Copy'},2000);
  });
}
async function startAuth(){
  const r=await fetch('/api/start',{method:'POST'});const d=await r.json();
  document.getElementById('user-code').textContent=d.user_code;
  const l=document.getElementById('verify-link');l.href=d.verification_uri;l.textContent=d.verification_uri;
  show('waiting');pollInterval=(d.interval||5)*1000;poll(d.device_code);
}
async function poll(dc){
  const r=await fetch('/api/poll',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_code:dc})});
  const d=await r.json();
  if(d.access_token){document.getElementById('username').textContent='@'+d.username;setToggle('codex',true);setToggle('claude',true);show('connected');return}
  if(d.error==='slow_down')pollInterval+=5000;
  pollTimer=setTimeout(()=>poll(dc),pollInterval);
}
// Reveals the field in place instead of navigating. The teaser line is replaced
// by the input so the screen gains one control rather than becoming a new page.
function revealToken(open){
  const area=document.getElementById('token-area');
  const teaser=document.getElementById('token-teaser');
  if(open===false){ area.classList.remove('open'); teaser.style.display=''; resetTokenForm(); return; }
  teaser.style.display='none';
  area.classList.add('open');
  setTimeout(()=>document.getElementById('token-input').focus(),50);
}
function resetTokenForm(){
  const i=document.getElementById('token-input');
  i.value='';i.disabled=false;i.classList.remove('bad');
  const b=document.getElementById('token-submit');
  b.disabled=true;b.textContent='Connect';
  document.getElementById('token-err').classList.remove('show');
}
function onTokenType(){
  const v=document.getElementById('token-input').value.trim();
  document.getElementById('token-submit').disabled=v.length===0;
  // Clear the previous failure as soon as the user starts fixing it, so a stale
  // message never sits above a token they have already corrected.
  document.getElementById('token-input').classList.remove('bad');
  document.getElementById('token-err').classList.remove('show');
}
// Each failure gets its own sentence because each has a different remedy. The
// no_copilot case in particular must not read like a bad token: the token is
// fine, and pasting a different one cannot help.
const TOKEN_ERRS={
  invalid_token:"That token isn't valid. Check you copied the whole thing.",
  no_copilot:"This token works, but the account has no Copilot access. A new token won't help \u2014 the subscription needs checking.",
  network:"Couldn't reach GitHub. Check your connection and try again.",
  github_error:"GitHub couldn't verify this token right now. Try again in a moment."
};
function tokenFail(reason){
  const i=document.getElementById('token-input'),b=document.getElementById('token-submit');
  i.disabled=false;i.classList.add('bad');
  b.disabled=false;b.textContent='Connect';
  document.getElementById('token-errmsg').textContent=TOKEN_ERRS[reason]||TOKEN_ERRS.github_error;
  document.getElementById('token-err').classList.add('show');
  i.focus();i.select();
}
async function submitToken(){
  const i=document.getElementById('token-input'),b=document.getElementById('token-submit');
  const token=i.value.trim();
  if(!token) return;
  i.disabled=true;b.disabled=true;
  b.innerHTML='<span class="spinner"></span> Verifying\u2026';
  document.getElementById('token-err').classList.remove('show');
  let d;
  try{
    const r=await fetch('/api/token-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
    d=await r.json();
  }catch(_){ tokenFail('network'); return; }
  if(!d||!d.ok){ tokenFail(d&&d.reason); return; }
  document.getElementById('username').textContent='@'+d.username;
  setToggle('codex',true);setToggle('claude',true);
  show('connected');
  revealToken(false);
}
async function toggleCodex(){
  const r=await fetch('/api/toggle-codex',{method:'POST'});const d=await r.json();setToggle('codex',d.codexEnabled);
}
async function toggleClaude(){
  const r=await fetch('/api/toggle-claude',{method:'POST'});const d=await r.json();setToggle('claude',d.claudeEnabled);
}
async function disconnect(){
  // The server decides where to land: a token user sent back to the GitHub
  // button would be stuck, since device flow needs the account holder's password.
  let next='idle';
  try{ const d=await(await fetch('/api/disconnect',{method:'POST'})).json(); if(d&&d.next)next=d.next; }catch(_){}
  show('idle');
  // A token user sent back to a bare GitHub button would be stuck: device flow
  // needs the account holder's password. Open the field for them directly.
  if(next==='token') revealToken(); else revealToken(false);
}
// Mirrors server state onto this window. The bridges can be toggled from another
// window, and a restored session arrives with them already on, so the toggles are
// read from the server rather than assumed. Callers guard on d.connected: an
// in-progress device-flow screen must never be repainted as connected.
function syncStatus(d){
  document.getElementById('username').textContent='@'+d.username;
  setToggle('codex',d.codexEnabled);
  setToggle('claude',d.claudeEnabled);
  renderUsage(d.usage);
}
// Copilot premium-request 用量条。服务端还没有提供 d.usage，所以今天这段永远走
// "隐藏" 分支 —— 面板的 min-height 保证隐藏时高度不塌，下方间距不受影响。
// 接上 /copilot_internal/user 之后，传入 {creditsUsed, entitlement} 即可点亮。
function renderUsage(u){
  const box=document.getElementById('usage');
  if(!box)return;
  // Hidden when there is nothing meaningful to draw: no data yet, or a seat with
  // unlimited premium requests (entitlement 0 — no ratio exists). The panel's
  // min-height keeps the box the same size either way, so the layout below it
  // never shifts.
  if(!u||u.unlimited||!u.entitlement||typeof u.creditsUsed!=='number'){box.classList.add('hidden');return;}
  const pct=Math.max(0,Math.min(100,u.creditsUsed/u.entitlement*100));
  document.getElementById('usage-used').textContent=u.creditsUsed.toLocaleString('en-US');
  document.getElementById('usage-ent').textContent=u.entitlement.toLocaleString('en-US');
  const fill=document.getElementById('usage-fill');
  // 额度是千万级，正常占比不到 1%——低于 0.5% 时套 .tiny 给最小可见宽度。
  fill.classList.toggle('tiny',pct<0.5);
  fill.style.width=Math.max(pct,pct>0?0.35:0)+'%';
  box.classList.remove('hidden');
}
fetch('/api/status').then(r=>r.json()).then(d=>{
  // Footer version comes from the server (package.json / build stamp) so it can
  // never drift from the actual build the way the old hard-coded string did.
  if(d.version){var v=document.getElementById('ver');v.textContent='v'+d.version+(d.releaseDate?' · '+d.releaseDate:'')}
  if(d.connected){syncStatus(d);show('connected')}
  else show('idle');
});
setInterval(()=>fetch('/api/status').then(r=>r.json()).then(d=>{if(d.connected)syncStatus(d)}).catch(()=>{}),2000);
setInterval(()=>fetch('/api/heartbeat',{method:'POST'}).catch(()=>{}),2000);
// Tell the bridge to shut down only when this window is GENUINELY closed. A tab
// that Edge/Windows merely freezes in the background does not fire pagehide, so
// the bridge survives minimization instead of being killed by a stalled
// heartbeat. persisted===true means bfcache (not a real close) — skip those.
window.addEventListener('pagehide',function(e){if(e.persisted)return;try{navigator.sendBeacon('/api/closing')}catch(_){}});

// ─── Ambient footer animation: "Dither Crossing" ───────────────────────────
// A 4px-pitch grid thresholded through an 8x8 Bayer matrix, with a travelling
// crest so the dissolve EDGE sweeps left→right — packets leaving the local
// client and arriving saturated on the Copilot side.
//
// This window can sit open for days, so idle cost is the whole design problem:
//   • No frames are scheduled at all when the tab is hidden, both bridges are
//     paused, or prefers-reduced-motion is set — those draw ONE static frame
//     and then cancel the rAF, rather than redrawing an identical picture 20x
//     a second forever.
//   • Colors are resolved once per theme change into a cached alpha ramp, so
//     the hot loop indexes an array instead of building rgba() strings per
//     cell (which would be ~20k string allocations a second).
//   • Redraw is capped at 20fps by a timestamp gate inside a single rAF loop.
(function(){
  var host=document.getElementById('dx');
  if(!host||!host.querySelector) return;
  var cv=document.getElementById('dx-canvas');
  if(!cv||!cv.getContext) return;            // no canvas → block stays empty
  var ctx=cv.getContext('2d');
  var BAYER=[0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21];
  for(var i=0;i<64;i++)BAYER[i]=(BAYER[i]+0.5)/64;
  var P=4,D=3,W=0,H=0,t=0,raf=0,last=0,pal=null;
  var reduceMQ=window.matchMedia?matchMedia('(prefers-reduced-motion:reduce)'):{matches:false};

  function rgb(h){var m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec((h||'').trim());
    return m?[parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)]:[128,128,128];}
  // Continuous muted → accent1 → accent2 ramp across the span, so the colour
  // shifts smoothly instead of stepping between three hard bands. Built as a
  // 2D lookup (HUES columns x 13 alpha steps) ONCE per theme, so the hot loop
  // only indexes an array — no per-cell string building, no per-cell lerp.
  var HUES=48;
  function mix(a,b,k){return [a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];}
  function theme(){
    var cs=getComputedStyle(document.documentElement);
    var cm=rgb(cs.getPropertyValue('--muted')||'#8b949e');
    var c1=rgb(cs.getPropertyValue('--accent1')||'#58a6ff');
    var c2=rgb(cs.getPropertyValue('--accent2')||'#a371f7');
    pal=[];
    for(var h=0;h<HUES;h++){
      var u=h/(HUES-1);
      // Two smoothstepped legs: muted→accent1 over the first half, then
      // accent1→accent2. Smoothstep keeps the joint at u=0.5 from reading as a
      // crease the way a raw linear blend does.
      var c;
      if(u<0.5){var k=u/0.5;c=mix(cm,c1,k*k*(3-2*k));}
      else{var k2=(u-0.5)/0.5;c=mix(c1,c2,k2*k2*(3-2*k2));}
      var r=Math.round(c[0]),g=Math.round(c[1]),b=Math.round(c[2]),col=[];
      for(var i=0;i<=12;i++)col.push('rgba('+r+','+g+','+b+','+(i/12).toFixed(3)+')');
      pal.push(col);
    }
  }
  function size(){
    var r=host.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
    W=Math.max(1,Math.round(r.width));H=Math.max(1,Math.round(r.height));
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function isPaused(){return host.getAttribute('data-state')==='paused';}
  function paint(){
    ctx.clearRect(0,0,W,H);
    if(!pal)return;
    var paused=isPaused(), head=((t*0.16)%1.9)-0.45;
    for(var x=1;x<W;x+=P){
      var u=x/W;
      var col=pal[(u*(HUES-1))|0];
      var g=paused?0:Math.exp(-Math.pow((u-head)*3.4,2))*0.55;
      for(var y=1;y<H;y+=P){
        var d=(0.10+u*0.80)*(0.35+0.65*(y/H))+g;
        if(d<=0.02)continue; if(d>1)d=1;
        if(d>BAYER[(((y/P)|0)&7)*8+(((x/P)|0)&7)]){
          ctx.fillStyle=col[(d*12)|0];
          ctx.fillRect(x,y,D,D);
        }
      }
    }
  }
  function loop(ts){raf=requestAnimationFrame(loop);if(ts-last<50)return;last=ts;t+=0.05;paint();}
  // The crux: when nothing can change, schedule nothing.
  function sync(){
    if(reduceMQ.matches||document.hidden||isPaused()){
      if(raf){cancelAnimationFrame(raf);raf=0;}
      paint(); return;
    }
    if(!raf){last=0;raf=requestAnimationFrame(loop);}
  }
  window.addEventListener('resize',function(){size();paint();},{passive:true});
  document.addEventListener('visibilitychange',sync);
  if(reduceMQ.addEventListener)reduceMQ.addEventListener('change',sync);
  // Repaint with a freshly-baked palette when the theme flips (manual or system).
  window.kobashiRepaintAnim=function(){theme();sync();paint();};
  // Driven by setToggle(): dim + freeze only when BOTH bridges are paused.
  window.kobashiAnimState=function(active){
    host.setAttribute('data-state',active?'active':'paused');sync();
  };
  theme();size();sync();
})();
</script>
